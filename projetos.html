
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projetos | Vitória Moraes</title>

    <!-- Conecta ao CSS principal do portfólio -->
    <link rel="stylesheet" href="style.css">

    <!-- Estilos exclusivos desta página -->
    <style>
        .pagina-projetos {
            min-height: 100vh;
            padding: 45px 20px;
        }

        .perfil-projetos {
            text-align: center;
            margin: 0 auto 35px;
        }

        .foto-projetos {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #AFCBEA;
            margin-bottom: 15px;
        }

        .perfil-projetos h1 {
            color: #24476C;
            margin-bottom: 10px;
        }

        .descricao-projetos {
            color: #466789;
        }

        .aviso-projetos {
            max-width: 650px;
            margin: 0 auto;
            padding: 40px 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid #B9CEE8;
            border-radius: 16px;
            box-sizing: border-box;
        }

        .icone-projetos {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .aviso-projetos h2 {
            color: #24476C;
            margin-bottom: 15px;
        }

        .aviso-projetos p {
            color: #466789;
            line-height: 1.8;
        }

        .voltar-projetos {
            display: block;
            width: fit-content;
            margin: 30px auto 0;
            color: #24476C;
            text-decoration: none;
        }

        .voltar-projetos:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .pagina-projetos {
                padding: 30px 16px;
            }

            .aviso-projetos {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="pagina-projetos">

        <!-- Perfil no topo -->
        <header class="perfil-projetos">

            <img
                src="perfil.jpeg"
                alt="Foto de Vitória Moraes"
                class="foto-projetos"
            >

            <h1>Vitória Moraes</h1>

            <p class="descricao-projetos">
                Desenvolvedora aprendiz Front-end no Programa Trilhas
            </p>

        </header>

        <!-- Aviso de projetos ainda não disponíveis -->
        <section class="aviso-projetos">

            <div class="icone-projetos" aria-hidden="true">
                💻
            </div>

            <h2>Em construção!</h2>

            <p>
                Ainda não há projetos por aqui.
            </p>

            <p>
                Estou aprendendo e desenvolvendo minhas habilidades
                em programação. Em breve, este espaço terá projetos
                que farão parte da minha jornada na tecnologia.
            </p>

        </section>

        <!-- Link para voltar à página inicial -->
        <a class="voltar-projetos" href="index.html">
            ← Voltar para o início
        </a>

    </main>

</body>
</html>
